name: Release launcher

on:
  push:
    tags: ["launcher-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Check version matches tag
        run: |
          want="${GITHUB_REF_NAME#launcher-v}"
          have=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "tag $want != tauri.conf.json $have" >&2
            exit 1
          fi

      - name: Build
        working-directory: launcher
        run: |
          npm ci
          npx tauri build

      # --latest=false: "latest" must stay a translation release,
      # the launcher reads releases/latest/download/manifest.json.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" launcher/src-tauri/target/release/bundle/nsis/*-setup.exe \
            --latest=false \
            --title "Лаунчер ${GITHUB_REF_NAME#launcher-v}" \
            --notes "Установщик лаунчера WuWa RU. Windows может предупредить о неизвестном издателе: файл не подписан."
